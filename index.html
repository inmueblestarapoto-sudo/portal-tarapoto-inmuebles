<style>
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;height:100%;}
  body{margin:0;min-height:100%;background:#DCD5C6;}
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap');
  :root{
    --navy:#16324A;
    --navy-dark:#0F2333;
    --cream:#F5F1E8;
    --gold:#B8935A;
    --white:#FFFFFF;
    --line:#E2DCCC;
    --ink:#2B2B2B;
    --muted:#8A8578;
    --amarillo:#F2C94C;
    --naranja:#E8823A;
    --azul:#2F6FA8;
  }
  *{box-sizing:border-box;}
  #portal-root{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--cream);
    color:var(--ink);
    min-height:100vh;
    max-width:480px;
    margin:0 auto;
    box-shadow:0 0 30px rgba(0,0,0,.1);
    position:relative;
  }

  /* ---- Hero ---- */
  .hero{position:relative;width:100%;height:72vh;min-height:420px;overflow:hidden;background:var(--navy-dark);}
  .hero-slide{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.4s ease;}
  .hero-slide.active{opacity:1;}
  .hero-shade{position:absolute;inset:0;background:linear-gradient(180deg, rgba(15,35,51,.45) 0%, rgba(15,35,51,.25) 40%, rgba(15,35,51,.85) 100%);}
  .hero-content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:48px;}
  .hero-logo{height:88px;width:auto;filter:brightness(0) invert(1) drop-shadow(0 2px 8px rgba(0,0,0,.35));}
  .hero-sub{color:var(--white);font-size:12px;font-weight:700;letter-spacing:5px;margin-top:8px;text-shadow:0 1px 6px rgba(0,0,0,.4);}

  /* ---- Search card (superpuesta sobre el hero) ---- */
  .search-card{position:relative;margin:-58px 16px 0;background:var(--white);border-radius:16px;padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:5;}
  .search-input{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-family:inherit;font-size:14.5px;color:var(--ink);background:var(--cream);margin-bottom:12px;}
  .action-row{display:flex;gap:8px;}
  .action-btn{flex:1;border:none;border-radius:11px;padding:13px 6px;font-family:inherit;font-weight:800;font-size:12.5px;letter-spacing:.5px;cursor:pointer;color:#1A1A1A;}
  .action-btn.alquilar{background:var(--amarillo);}
  .action-btn.comprar{background:var(--naranja);color:var(--white);}
  .action-btn.vender{background:var(--azul);color:var(--white);}
  .action-btn:active{opacity:.8;}

  .results-section{padding:18px 16px 40px;min-height:260px;}
  .portal-footer{background:var(--navy-dark);padding:26px 20px 20px;text-align:center;}
  .footer-social{display:flex;justify-content:center;gap:14px;margin-bottom:16px;}
  .footer-social a{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;}
  .footer-links{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 16px;margin-bottom:14px;}
  .footer-links a{color:rgba(255,255,255,.75);font-size:11.5px;text-decoration:none;}
  .footer-links a:hover{text-decoration:underline;}
  .footer-copy{color:rgba(255,255,255,.5);font-size:11px;}
  .results-title{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--navy);margin-bottom:10px;}
  .prop-list{display:flex;flex-direction:column;gap:10px;}
  .prop-card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;gap:10px;align-items:center;cursor:pointer;}
  .prop-thumb{width:56px;height:56px;border-radius:9px;background:var(--cream);flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted);font-size:9px;}
  .prop-thumb img{width:100%;height:100%;object-fit:cover;}
  .prop-info{flex:1;min-width:0;}
  .prop-title{font-size:14px;font-weight:700;color:var(--navy);}
  .prop-sub{font-size:11px;color:var(--muted);}
  .prop-price{font-size:13px;font-weight:800;color:var(--gold);white-space:nowrap;}
  .empty-note{text-align:center;color:var(--muted);font-size:13.5px;padding:20px 10px;font-style:italic;}

  /* ---- Flujo de preguntas ---- */
  .flow-overlay{position:fixed;inset:0;background:rgba(15,35,51,.6);z-index:58;display:flex;align-items:center;justify-content:center;padding:20px;}
  .flow-card{background:var(--white);border-radius:16px;padding:22px;max-width:380px;width:100%;max-height:85vh;overflow-y:auto;}
  .flow-card h3{font-family:'Playfair Display',serif;font-size:19px;color:var(--navy);margin:0 0 16px;}
  .flow-options{display:flex;flex-direction:column;gap:9px;margin-bottom:6px;}
  .flow-opt-btn{background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:13px;font-family:inherit;font-weight:700;font-size:14px;color:var(--ink);cursor:pointer;text-align:left;}
  .flow-opt-btn:active{background:var(--gold);color:var(--white);}
  .flow-row2{display:flex;gap:8px;margin-bottom:12px;}
  .flow-row2 input{flex:1;border:1px solid var(--line);border-radius:9px;padding:11px;font-family:inherit;font-size:14px;min-width:0;}
  .flow-btn-primary{width:100%;background:var(--navy);color:var(--white);border:none;border-radius:10px;padding:13px;font-weight:800;font-size:14px;cursor:pointer;margin-top:4px;}
  .flow-close{position:absolute;top:14px;right:16px;background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted);}
  .flow-card{position:relative;}

  /* ---- Ficha pública simplificada ---- */
  .pd-overlay{position:fixed;inset:0;background:var(--cream);z-index:55;overflow-y:auto;}
  .pd-close{position:fixed;top:14px;left:14px;background:rgba(0,0,0,.35);border:none;color:var(--white);width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer;z-index:57;}
  .pd-photo{width:100%;aspect-ratio:1/1;background:var(--white);}
  .pd-secundarias{display:flex;gap:6px;padding:10px 18px 0;}
  .pd-sec-thumb{position:relative;flex:1;aspect-ratio:1/1;border-radius:8px;overflow:hidden;background:var(--white);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:9px;cursor:pointer;}
  .pd-sec-thumb img{width:100%;height:100%;object-fit:cover;}
  .pd-zoom-icon{position:absolute;bottom:6px;right:6px;width:22px;height:22px;border-radius:50%;background:rgba(22,50,74,.75);display:flex;align-items:center;justify-content:center;pointer-events:none;color:var(--white);font-size:10px;}
  .pd-lightbox-bg{position:fixed;inset:0;background:rgba(10,9,7,.94);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;}
  .pd-lightbox-bg img{max-width:100%;max-height:85vh;object-fit:contain;}
  .pd-lightbox-close{position:absolute;top:16px;right:18px;background:none;border:none;color:var(--white);font-size:26px;cursor:pointer;line-height:1;}
  .pd-photo img{width:100%;height:100%;object-fit:cover;}
  .pd-body{padding:18px 18px 100px;}
  .pd-attrs{font-size:15px;font-weight:700;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
  .pd-title{font-family:'Playfair Display',serif;font-size:22px;color:var(--navy);margin-bottom:6px;}
  .pd-price{font-size:19px;font-weight:800;color:var(--gold);margin-bottom:16px;}
  .pd-price-row{display:flex;align-items:baseline;justify-content:flex-start;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .pd-price-row .pd-price{margin-bottom:0;}
  .pd-price-tag{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--navy);background:var(--cream);border:1px solid var(--line);border-radius:8px;padding:5px 10px;white-space:nowrap;flex:none;}
  .pd-section-title{font-size:14px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--navy);margin-bottom:6px;margin-top:16px;}
  .pd-text{font-size:17px;color:var(--ink);line-height:1.55;}
  .pd-cta{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--line);padding:13px 16px;max-width:480px;margin:0 auto;display:flex;gap:8px;}
  .pd-call-btn{flex:0 0 54px;background:var(--cream);color:var(--navy);border:1px solid var(--line);border-radius:10px;padding:14px 0;font-weight:800;font-size:18px;cursor:pointer;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;}
  .pd-cta-btn{flex:1;background:var(--azul);color:var(--white);border:none;border-radius:10px;padding:14px;font-weight:800;font-size:14.5px;cursor:pointer;}
  #pd-compartir{flex:0 0 auto;background:var(--cream);color:var(--navy);border:1px solid var(--line);}
  .pd-caract-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:4px;}
  .pd-caract-chip{display:flex;align-items:center;gap:8px;background:var(--cream);border-radius:9px;padding:9px 11px;font-size:14.5px;color:var(--ink);}
  .pd-caract-icon{font-size:18px;}

  /* ---- Formulario de venta ---- */
  .sf-body{padding:16px 18px 30px;background:var(--white);}
  .sf-field{margin-bottom:13px;}
  .sf-field label{display:block;font-size:13px;font-weight:700;color:var(--navy);margin-bottom:6px;}
  .sf-field input, .sf-field textarea, .sf-field select{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:12px;font-family:inherit;font-size:15.5px;color:var(--ink);background:var(--white);}
  .sf-check-row span{font-size:13.5px;line-height:1.45;color:var(--ink);}
  .sf-field textarea{resize:vertical;}
  .sf-check-row{display:flex;align-items:flex-start;gap:9px;background:var(--cream);border-radius:10px;padding:12px;margin-bottom:13px;}
  .sf-check-row input{margin-top:3px;}
  .sf-disclaimer{background:#FBF3E3;border:1px solid var(--gold);border-radius:10px;padding:13px;font-size:12.5px;line-height:1.5;color:var(--ink);margin-bottom:16px;}
  .sf-sign-label{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px;}
  .sf-sign-canvas{width:100%;height:140px;border:1.5px dashed var(--line);border-radius:10px;background:var(--white);touch-action:none;}
  .sf-sign-clear{background:none;border:none;color:var(--azul);font-size:12px;font-weight:700;cursor:pointer;margin-top:6px;}
  .sf-attach-btn{width:100%;background:var(--cream);border:1px solid var(--line);color:var(--navy);border-radius:9px;padding:12px;font-family:inherit;font-weight:700;font-size:13.5px;cursor:pointer;}
  .sf-submit{width:100%;background:var(--azul);color:var(--white);border:none;border-radius:11px;padding:14px;font-weight:800;font-size:14.5px;cursor:pointer;margin-top:6px;}
  /* ---- Wizard de 3 pasos ---- */
  .sf-steps{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:6px;}
  .sf-step-dot{width:28px;height:28px;border-radius:50%;background:var(--cream);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--muted);flex:none;}
  .sf-step-dot.active{background:var(--azul);border-color:var(--azul);color:var(--white);}
  .sf-step-dot.done{background:var(--gold);border-color:var(--gold);color:var(--white);}
  .sf-step-line{width:24px;height:2px;background:var(--line);flex:none;}
  .sf-step-line.done{background:var(--gold);}
  .sf-step-label{text-align:center;font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--navy);margin-bottom:18px;}
  .sf-panel{display:none;}
  .sf-panel.active{display:block;}
  .sf-nav{display:flex;gap:8px;margin-top:6px;}
  .sf-back-btn{flex:0 0 92px;background:var(--cream);color:var(--navy);border:1px solid var(--line);border-radius:11px;padding:14px 4px;font-family:inherit;font-weight:800;font-size:13.5px;cursor:pointer;}
  .sf-next-btn{flex:1;background:var(--azul);color:var(--white);border:none;border-radius:11px;padding:14px;font-family:inherit;font-weight:800;font-size:14.5px;cursor:pointer;}
  /* ---- Contadores +/- de características ---- */
  .sf-counter-row{display:flex;align-items:center;justify-content:space-between;background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;}
  .sf-counter-label{font-size:13.5px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:8px;}
  .sf-counter-ctrl{display:flex;align-items:center;gap:12px;flex:none;}
  .sf-counter-btn{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--azul);background:var(--white);color:var(--azul);font-size:17px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;font-family:inherit;}
  .sf-counter-btn:active{background:var(--azul);color:var(--white);}
  .sf-counter-value{min-width:18px;text-align:center;font-size:15px;font-weight:800;color:var(--navy);}
  @media (min-width: 860px){
    body{ padding:32px 16px; }
    #portal-root{ max-width:1200px; border-radius:18px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.18); }
    .hero{ height:64vh; min-height:460px; }
    .hero-logo{ height:110px; }
    .hero-sub{ font-size:14px; letter-spacing:6px; }
    .search-card{ margin:-64px 36px 0; padding:22px; border-radius:18px; }
    .search-input{ padding:14px 16px; font-size:16px; border-radius:12px; }
    .action-row{ gap:12px; }
    .action-btn{ padding:15px 8px; font-size:14px; border-radius:13px; }
    .results-section{ padding:26px 36px 50px; }
    .results-title{ font-size:13px; margin-bottom:14px; }
    .prop-list{ display:grid; grid-template-columns:repeat(auto-fill, minmax(320px,1fr)); gap:14px; }
    .prop-card{ padding:13px; border-radius:14px; }
    .prop-thumb{ width:64px; height:64px; border-radius:10px; }
    .prop-title{ font-size:15.5px; }
    .prop-price{ font-size:14.5px; }

    .flow-card{ max-width:440px; padding:28px; border-radius:18px; }
    .flow-card h3{ font-size:21px; }
    .flow-opt-btn{ padding:15px; font-size:15px; }
    .flow-row2 input, .flow-row2 select{ padding:13px; font-size:15.5px; }
    .flow-btn-primary{ padding:14px; font-size:15px; }

    .pd-close{ width:38px; height:38px; font-size:19px; }
    .pd-main{ display:flex; align-items:flex-start; gap:32px; max-width:1200px; margin:0 auto; padding:70px 36px 50px; }
    .pd-left{ flex:0 0 420px; }
    .pd-right{ flex:1; min-width:0; }
    .pd-photo{ border-radius:16px; overflow:hidden; }
    .pd-secundarias{ padding:10px 0 0; margin:0; }
    .pd-body{ padding:0 0 24px; margin:0; }
    .pd-title{ font-size:26px; }
    .pd-price{ font-size:22px; }
    .pd-price-tag{ font-size:13px; padding:6px 12px; }
    .pd-attrs{ font-size:16px; }
    .pd-section-title{ font-size:14px; }
    .pd-text{ font-size:17px; }
    .pd-cta{ position:static; background:none; border-top:none; box-shadow:none; padding:0; max-width:none; margin:0; }
    .pd-cta-btn{ padding:16px; font-size:15.5px; }
    .pd-call-btn{ width:58px; font-size:20px; }

    .sf-body{ max-width:760px; margin:0 auto; padding:24px 20px 40px; }
    .sf-field label{ font-size:13.5px; }
    .sf-field input, .sf-field textarea, .sf-field select{ padding:13px; font-size:15.5px; border-radius:11px; }
    .sf-disclaimer{ font-size:14px; padding:16px; }
    .sf-check-row span{ font-size:14.5px; }
    .sf-sign-label{ font-size:13px; }
    .sf-submit{ padding:16px; font-size:16px; }
    .sf-next-btn{ padding:16px; font-size:15.5px; }
    .sf-back-btn{ padding:16px 6px; font-size:14.5px; flex-basis:110px; }
    .sf-step-dot{ width:32px; height:32px; font-size:13px; }
    .sf-step-line{ width:34px; }
    .sf-step-label{ font-size:12px; }
    .sf-counter-label{ font-size:14.5px; }
    .sf-counter-btn{ width:34px; height:34px; font-size:19px; }
    .sf-counter-value{ font-size:16px; }
    .choice-body{ max-width:600px; margin:0 auto; padding:40px 20px; }
    .choice-title{ font-size:25px; }
    .choice-btn{ padding:18px; font-size:17px; }
  }
</style>
</head>

<script>
(function(){
  const SUPABASE_URL = 'https://tqistvisnbcmiocmimos.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_NyCjJkq-17DqOv-5GVg42Q_Cvt2Bp19';
  // 🔧 Pega aquí el número de WhatsApp de Tarapoto Inmuebles (con código de país, sin + ni espacios)
  const WHATSAPP_NUMBER = '51992226283';

  let properties = [];
  const sbHeaders = { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY };
  const CLOUDINARY_CLOUD = 'ji3rmidr';
  const CLOUDINARY_PRESET = 'tarapoto_inmuebles';

  async function uploadFile(file){
    const fd = new FormData();
    fd.append('file', file);
    fd.append('upload_preset', CLOUDINARY_PRESET);
    const res = await fetch('https://api.cloudinary.com/v1_1/'+CLOUDINARY_CLOUD+'/auto/upload', {method:'POST', body:fd});
    const data = await res.json();
    if(!data.secure_url) throw new Error('upload failed');
    return data.secure_url;
  }

  const resultsWrap = document.getElementById('results-wrap');
  const resultsTitle = document.getElementById('results-title');
  const flowRoot = document.getElementById('flow-root');
  const pdRoot = document.getElementById('pd-root');
  const sfRoot = document.getElementById('sf-root');

  function escapeHtml(s){
    return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function abrirEnlaceExterno(url){
    const a = document.createElement('a');
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }
  function money(n, moneda){
    const simbolo = moneda === 'PEN' ? 'S/' : '$';
    return simbolo + Number(n||0).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  }

  async function sbGet(path){
    const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, { headers: sbHeaders });
    if(!res.ok) throw new Error('get failed');
    return res.json();
  }
  async function sbInsert(table, obj){
    const res = await fetch(SUPABASE_URL + '/rest/v1/' + table, {
      method:'POST',
      headers: Object.assign({'Content-Type':'application/json', Prefer:'return=minimal'}, sbHeaders),
      body: JSON.stringify(obj)
    });
    return res.ok;
  }

  // ---- Carrusel del hero ----
  const slides = [document.getElementById('hero-0'), document.getElementById('hero-1'), document.getElementById('hero-2')];
  let slideIdx = 0;
  setInterval(function(){
    slides[slideIdx].classList.remove('active');
    slideIdx = (slideIdx + 1) % slides.length;
    slides[slideIdx].classList.add('active');
  }, 4500);

  // ---- Cargar propiedades activas ----
  async function loadProperties(){
    try{
      const data = await sbGet('propiedades?select=*&estado=eq.activo&order=created_at.desc');
      properties = data || [];
      renderResults(properties, 'Propiedades destacadas');
      const idCompartida = new URLSearchParams(window.location.search).get('propiedad');
      if(idCompartida){
        const encontrada = properties.find(p => String(p.id) === idCompartida);
        if(encontrada) openPublicDetail(encontrada);
        else alert('Esa propiedad ya no está disponible.');
      }
    }catch(e){
      resultsWrap.innerHTML = '<div class="empty-note">No se pudo conectar. Revisa tu conexión.</div>';
    }
  }

  function renderResults(list, titulo){
    resultsTitle.textContent = titulo;
    if(!list || list.length === 0){
      resultsWrap.innerHTML = '<div class="empty-note">No encontramos propiedades con esas características por ahora.</div>';
      return;
    }
    resultsWrap.innerHTML = '<div class="prop-list">' + list.map(function(p){
      const thumb = p.foto_principal ? '<img src="'+p.foto_principal+'" alt=""/>' : 'Sin foto';
      return '<div class="prop-card" data-id="'+p.id+'">'
        + '<div class="prop-thumb">'+thumb+'</div>'
        + '<div class="prop-info"><div class="prop-title">'+escapeHtml(p.titulo||'Sin título')+'</div><div class="prop-sub">'+(p.metros||'—')+' '+(p.unidad_metros||'m²')+'</div></div>'
        + '<div class="prop-price">'+money(p.precio_real, p.moneda)+'</div>'
      + '</div>';
    }).join('') + '</div>';
    resultsWrap.querySelectorAll('.prop-card').forEach(function(card){
      card.addEventListener('click', function(){
        const p = list.find(x => String(x.id) === card.getAttribute('data-id'));
        if(p) openPublicDetail(p);
      });
    });
  }

  // ---- Buscador libre (interpreta precio, metraje y características en texto natural) ----
  function normalizar(s){
    return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  }
  function bolsaDe(p){
    return normalizar([p.titulo, p.caracteristicas, p.destacados, p.direccion, p.referencia, p.tipo, p.estado_legal].join(' '));
  }
  let searchTimer = null;
  document.getElementById('search-input').addEventListener('input', function(e){
    const original = e.target.value.trim();
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function(){
      if(!original){ renderResults(properties, 'Propiedades destacadas'); return; }
      let q = normalizar(original);

      // 1) ¿Menciona un metraje? Ej: "500m2", "500 m2", "2 hectareas"
      let sizeNum = null, sizeEsHectarea = false;
      const sizeMatch = q.match(/(\d+(?:[.,]\d+)?)\s*(m2|m²|mts2|mts|metros|hectareas|hectarea|ha)\b/);
      if(sizeMatch){
        sizeNum = parseFloat(sizeMatch[1].replace(',', '.'));
        sizeEsHectarea = /hectarea|^ha$/.test(sizeMatch[2]);
        q = q.replace(sizeMatch[0], ' ');
      }

      // 2) ¿Menciona un precio? Ej: "$100000", "100.000", "100,000 dolares"
      let priceNum = null;
      const priceMatch = q.match(/\$?\s*(\d{1,3}(?:[.,]\d{3})+|\d{4,})/);
      if(priceMatch){
        priceNum = parseInt(priceMatch[1].replace(/[.,]/g, ''), 10);
        q = q.replace(priceMatch[0], ' ');
      }

      // 3) Lo que queda son palabras clave de texto libre (características, zona, tipo, etc.)
      const palabras = q.split(/\s+/).map(w => w.trim()).filter(w => w.length > 1);

      const filtradas = properties.filter(function(p){
        if(sizeNum){
          const unidadOk = sizeEsHectarea ? (p.unidad_metros === 'hectáreas') : (p.unidad_metros !== 'hectáreas');
          if(!unidadOk) return false;
          if(!p.metros || Math.abs(p.metros - sizeNum) / sizeNum > 0.25) return false;
        }
        if(priceNum){
          if(!p.precio_real || Math.abs(p.precio_real - priceNum) / priceNum > 0.25) return false;
        }
        if(palabras.length){
          const bolsa = bolsaDe(p);
          if(!palabras.every(w => bolsa.includes(w))) return false;
        }
        return true;
      });
      renderResults(filtradas, 'Resultados de búsqueda');
    }, 350);
  });

  function normalizarCaractTexto(s){
    return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
  }

  function buildCaracteristicasTexto(counts, adicionales){
    const partes = CARACT_COUNTERS
      .filter(c => (counts[c.key]||0) > 0)
      .map(c => (counts[c.key])+' '+c.label.toLowerCase());
    let texto = partes.join(', ');
    if(adicionales && adicionales.trim()){
      texto = texto ? (texto + '. Otras características: ' + adicionales.trim()) : adicionales.trim();
    }
    return texto;
  }

  function parseCaracteristicasTexto(texto){
    const counts = {};
    CARACT_COUNTERS.forEach(c => counts[c.key] = 0);
    let otros = '';
    if(!texto){ return {counts: counts, otros: otros}; }
    const marcador = '. Otras características: ';
    const idx = texto.indexOf(marcador);
    const estructurado = idx !== -1 ? texto.slice(0, idx) : texto;
    otros = idx !== -1 ? texto.slice(idx + marcador.length) : '';
    estructurado.split(',').map(s => s.trim()).filter(Boolean).forEach(function(seg){
      const m = seg.match(/^(\d+)\s+(.+)$/);
      if(m){
        const num = parseInt(m[1]);
        const etiquetaNorm = normalizarCaractTexto(m[2]);
        const claveMatch = Object.keys(CARACT_SINONIMOS).find(k => CARACT_SINONIMOS[k].some(s => normalizarCaractTexto(s) === etiquetaNorm));
        if(claveMatch){ counts[claveMatch] = num; return; }
      }
      otros = otros ? (otros + ', ' + seg) : seg;
    });
    return {counts: counts, otros: otros};
  }

  function caracteristicasIconosHtml(texto){
    const parsed = parseCaracteristicasTexto(texto);
    const chips = CARACT_COUNTERS
      .filter(c => (parsed.counts[c.key]||0) > 0)
      .map(c => '<div class="pd-caract-chip"><span class="pd-caract-icon">'+c.icon+'</span><span>'+parsed.counts[c.key]+' '+c.label+'</span></div>')
      .join('');
    const otrosHtml = parsed.otros ? '<div class="pd-text" style="margin-top:8px;">'+escapeHtml(parsed.otros)+'</div>' : '';
    return '<div class="pd-caract-grid">'+chips+'</div>'+otrosHtml;
  }

            + '<div class="sf-disclaimer">'
              + (esAlquiler
                  ? '<b>Somos agentes inmobiliarios especializados en Tarapoto.</b> Nuestros honorarios en alquileres son el <b>equivalente a un mes de alquiler</b>. Por ejemplo, si tu propiedad se alquila por S/ 1,000, ese sería nuestro honorario — con eso invertimos en marketing, carteles, contactos y seguimiento para alquilarla más rápido.'
                  : '<b>Somos agentes inmobiliarios especializados en Tarapoto.</b> Nuestros honorarios son del <b>3% al 5%</b> del precio de venta (según la propiedad), con los que invertimos en marketing, carteles, contactos y seguimiento para vender tu propiedad más rápido.')
            + '</div>'
            + '<div class="sf-check-row" style="background:#FBF3E3;border:1px solid var(--gold);">'
              + '<input type="checkbox" id="sf-acepto"/>'
              + '<span>Declaro que la información brindada es verídica y de mi titularidad, y <b>autorizo expresamente</b> a Tarapoto Inmuebles a recibir, procesar y publicar estos datos según lo aquí descrito. Esta aceptación constituye manifestación de mi voluntad conforme al <b>artículo 141 del Código Civil peruano</b> y la <b>Ley N° 27269 de Firmas y Certificados Digitales</b>, y queda registrada con fecha, hora e IP de envío como prueba de conformidad.</span>'
            + '</div>'
            + '<div class="sf-nav"><button type="button" class="sf-back-btn" id="sf-back-3">← Atrás</button><button type="button" class="sf-next-btn" id="sf-submit">Enviar mi propiedad</button></div>'
          + '</div>'
        + '</div>'
      + '</div>';

    document.getElementById('sf-close').addEventListener('click', () => sfRoot.innerHTML='');
    document.getElementById('sf-permite-redes').addEventListener('change', function(e){
      document.getElementById('sf-motivo-wrap').style.display = e.target.checked ? 'none' : 'block';
    });

    // ---- Contadores +/- de características ----
    const countersWrap = document.getElementById('sf-counters');
    countersWrap.innerHTML = CARACT_COUNTERS.map(function(c){
      return '<div class="sf-counter-row">'
        + '<div class="sf-counter-label">'+c.icon+' '+c.label+'</div>'
        + '<div class="sf-counter-ctrl">'
          + '<button type="button" class="sf-counter-btn" data-key="'+c.key+'" data-dir="-1">−</button>'
          + '<div class="sf-counter-value" id="sf-count-'+c.key+'">0</div>'
          + '<button type="button" class="sf-counter-btn" data-key="'+c.key+'" data-dir="1">+</button>'
        + '</div>'
      + '</div>';
    }).join('');
    countersWrap.querySelectorAll('.sf-counter-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        const key = btn.getAttribute('data-key');
        const dir = Number(btn.getAttribute('data-dir'));
        counts[key] = Math.max(0, Math.min(20, (counts[key]||0) + dir));
        document.getElementById('sf-count-'+key).textContent = counts[key];
      });
    });

    // ---- Navegación del wizard ----
    function irAPaso(n){
      pasoActual = n;
      [1,2,3].forEach(function(i){
        document.getElementById('sf-panel-'+i).classList.toggle('active', i===n);
        const dot = document.getElementById('sf-dot-'+i);
        dot.classList.toggle('active', i===n);
        dot.classList.toggle('done', i<n);
        if(i<3){ document.getElementById('sf-line-'+i).classList.toggle('done', i<n); }
      });
      const labels = {
        1:'Paso 1 de 3 · Datos de contacto y ubicación',
        2:'Paso 2 de 3 · Precio y características',
        3:'Paso 3 de 3 · Fotos, documentos y autorización'
      };
      document.getElementById('sf-step-label').textContent = labels[n];
      document.getElementById('sf-panel-'+n).scrollIntoView({block:'start'});
      sfRoot.querySelector('.pd-overlay').scrollTop = 0;
    }

    document.getElementById('sf-next-1').addEventListener('click', function(){
      const nombre = document.getElementById('sf-nombre').value.trim();
      const telefono = document.getElementById('sf-telefono').value.trim();
      const email = document.getElementById('sf-email').value.trim();
      if(!nombre || !telefono || !email){ alert('Completa tu nombre, teléfono y correo para continuar.'); return; }
      irAPaso(2);
    });
    document.getElementById('sf-back-2').addEventListener('click', () => irAPaso(1));
    document.getElementById('sf-next-2').addEventListener('click', function(){
      const fecha = document.getElementById('sf-fecha-adquisicion').value;
      const antes2004 = document.getElementById('sf-antes-2004').checked;
      if(!fecha && !antes2004){ alert('Ingresa la fecha de adquisición, o marca la casilla si fue antes del 01/01/2004.'); return; }
      irAPaso(3);
    });
    document.getElementById('sf-back-3').addEventListener('click', () => irAPaso(2));

    const sfState = { foto_principal:'', fotos_secundarias:[null,null,null,null], documentos:[] };

    document.getElementById('sf-slot-principal').addEventListener('click', () => document.getElementById('sf-file-principal').click());
    document.getElementById('sf-file-principal').addEventListener('change', async function(e){
      const file = e.target.files[0]; if(!file) return;
      const slot = document.getElementById('sf-slot-principal');
      slot.textContent = 'Subiendo...';
      try{
        const url = await uploadFile(file);
        sfState.foto_principal = url;
        slot.innerHTML = '<img src="'+url+'" alt="" style="width:100%;height:100%;object-fit:cover;"/>';
      }catch(err){ slot.textContent = 'Error, toca para reintentar'; }
    });

    const secWrap = document.getElementById('sf-slots-secundarias');
    secWrap.innerHTML = [0,1,2,3].map(i => '<div class="pf-photo-slot" id="sf-slot-sec-'+i+'" style="width:70px;height:70px;border-radius:9px;border:1.5px dashed var(--line);background:var(--cream);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);font-size:10px;overflow:hidden;">Foto '+(i+1)+'</div><input type="file" accept="image/*" data-sec-input="'+i+'" style="display:none"/>').join('');
    [0,1,2,3].forEach(function(i){
      const slot = document.getElementById('sf-slot-sec-'+i);
      const input = document.querySelector('[data-sec-input="'+i+'"]');
      slot.addEventListener('click', () => input.click());
      input.addEventListener('change', async function(e){
        const file = e.target.files[0]; if(!file) return;
        slot.textContent = 'Subiendo...';
        try{
          const url = await uploadFile(file);
          sfState.fotos_secundarias[i] = url;
          slot.innerHTML = '<img src="'+url+'" alt="" style="width:100%;height:100%;object-fit:cover;"/>';
        }catch(err){ slot.textContent = 'Error'; }
      });
    });

    document.getElementById('sf-attach-btn').addEventListener('click', () => document.getElementById('sf-file-docs').click());
    document.getElementById('sf-file-docs').addEventListener('change', async function(e){
      const files = Array.from(e.target.files || []);
      const listEl = document.getElementById('sf-docs-list');
      for(const file of files){
        listEl.innerHTML += '<div>⏳ Subiendo '+escapeHtml(file.name)+'...</div>';
        try{
          const url = await uploadFile(file);
          sfState.documentos.push({nombre:file.name, url:url});
          listEl.innerHTML = sfState.documentos.map(d => '✅ '+escapeHtml(d.nombre)).join('<br/>');
        }catch(err){
          listEl.innerHTML += '<div>❌ No se pudo subir '+escapeHtml(file.name)+'</div>';
        }
      }
    });

    async function obtenerIP(){
      try{
        const res = await fetch('https://api.ipify.org?format=json');
        const data = await res.json();
        return data.ip || 'no disponible';
      }catch(e){ return 'no disponible'; }
    }

    document.getElementById('sf-submit').addEventListener('click', async function(){
      const btn = this;
      const nombre = document.getElementById('sf-nombre').value.trim();
      const telefono = document.getElementById('sf-telefono').value.trim();
      const email = document.getElementById('sf-email').value.trim();
      const monto = parseFloat(document.getElementById('sf-monto').value) || 0;
      if(!nombre || !telefono || !email){ alert('Completa tu nombre, teléfono y correo.'); irAPaso(1); return; }
      if(!document.getElementById('sf-acepto').checked){ alert('Debes aceptar la declaración de autorización para continuar.'); return; }
      const fechaAdquisicion = document.getElementById('sf-fecha-adquisicion').value;
      const antes2004 = document.getElementById('sf-antes-2004').checked;
      if(!fechaAdquisicion && !antes2004){ alert('Ingresa la fecha de adquisición del inmueble, o marca la casilla si fue antes del 01/01/2004.'); irAPaso(2); return; }
      const tipoBase = document.getElementById('sf-tipo').value;
      const direccion = document.getElementById('sf-direccion').value.trim();
      btn.disabled = true; btn.textContent = 'Enviando...';
      const ip = await obtenerIP();
      const consentimientoTexto = 'Declaro que la información brindada es verídica y de mi titularidad, y autorizo expresamente a Tarapoto Inmuebles a recibir, procesar y publicar estos datos según lo aquí descrito. Esta aceptación constituye manifestación de mi voluntad conforme al artículo 141 del Código Civil peruano y la Ley N° 27269 de Firmas y Certificados Digitales.';
      const adicionales = document.getElementById('sf-adicionales').value.trim();
      const propiedad = {
        id: Date.now()+'-'+Math.random().toString(36).slice(2,7),
        titulo: direccion ? ('Propiedad en '+direccion) : ('Propiedad de '+nombre),
        tipo: tipoBase + '_' + tipoOperacion,
        metros: parseFloat(document.getElementById('sf-metros').value) || 0,
        unidad_metros: document.getElementById('sf-unidad-metros').value,
        moneda: document.getElementById('sf-moneda').value,
        precio_real: monto,
        precio_minimo: 0,
        dueno_nombre: nombre,
        dueno_contacto: telefono,
        dueno_email: email,
        dueno_resena: '',
        direccion: direccion,
        referencia: document.getElementById('sf-referencia').value.trim(),
        motivo_venta: document.getElementById('sf-motivo-venta').value.trim(),
        estado_legal: document.getElementById('sf-estado-legal').value,
        fecha_adquisicion: fechaAdquisicion || null,
        adquirido_antes_2004: antes2004,
        caracteristicas: buildCaracteristicasTexto(counts, adicionales),
        destacados: '',
        foto_principal: sfState.foto_principal,
        fotos_secundarias: sfState.fotos_secundarias,
        archivos: sfState.documentos.length ? {otros: sfState.documentos} : {},
        urgencia: 'sin_apuro',
        permite_redes: document.getElementById('sf-permite-redes').checked,
        motivo_no_redes: document.getElementById('sf-motivo') ? document.getElementById('sf-motivo').value.trim() : '',
        ip_aceptacion: ip,
        consentimiento_texto: consentimientoTexto,
        fecha_aceptacion: new Date().toISOString(),
        estado: 'pendiente',
        origen: 'portal_publico'
      };
      try{
        const ok = await sbInsert('propiedades', propiedad);
        if(ok){
          try{
            await sbInsert('clientes', {
              id: Date.now()+'-'+Math.random().toString(36).slice(2,7),
              nombre: nombre,
              contacto: telefono,
              email: email,
              intencion: 'vendedor',
              origen: 'portal',
              propiedad_interes_titulo: propiedad.titulo,
              etapa: 'nuevo',
              notas: 'Quiere vender/alquilar su propiedad (enviada desde el Portal Inmobiliario).' + (propiedad.motivo_venta ? ' Motivo: '+propiedad.motivo_venta : ''),
              created_at: new Date().toISOString(),
              updated_at: new Date().toISOString()
            });
          }catch(e){ /* si falla el registro en el CRM, no bloquea el envío de la propiedad */ }
          sfRoot.innerHTML =
            '<div class="pd-overlay"><div class="sf-body" style="padding-top:80px;text-align:center;">'
            + '<div class="pd-title">¡Gracias, '+escapeHtml(nombre)+'! 🎉</div>'
            + '<p class="pd-text">Con esta información evaluaremos tu propiedad y te informaremos si fue aprobada por nuestro equipo técnico.</p>'
            + '<button class="sf-submit" id="sf-done">Volver al portal</button>'
            + '</div></div>';
          document.getElementById('sf-done').addEventListener('click', () => sfRoot.innerHTML='');
        } else {
          btn.disabled = false; btn.textContent = 'Enviar mi propiedad';
          alert('No se pudo enviar. Revisa tu conexión e intenta de nuevo.');
        }
      }catch(err){
        btn.disabled = false; btn.textContent = 'Enviar mi propiedad';
        alert('No se pudo enviar. Revisa tu conexión e intenta de nuevo.');
      }
    });
  }

  const footerYearEl = document.getElementById('footer-year');
  if(footerYearEl) footerYearEl.textContent = new Date().getFullYear();

  loadProperties();
})();
</script>
</body>
</html>
