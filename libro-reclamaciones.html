<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Libro de Reclamaciones - Tarapoto Inmuebles</title>
<style>
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;height:100%;}
  body{margin:0;min-height:100%;background:#DCD5C6;}
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap');
  :root{
    --navy:#16324A; --navy-dark:#0F2333; --cream:#F5F1E8; --gold:#B8935A;
    --white:#FFFFFF; --line:#E2DCCC; --ink:#2B2B2B; --muted:#8A8578; --azul:#2F6FA8;
  }
  *{box-sizing:border-box;}
  #app-root{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;max-width:520px;margin:0 auto;box-shadow:0 0 30px rgba(0,0,0,.1);}
  .top-header{background:linear-gradient(160deg, var(--navy) 0%, var(--navy-dark) 100%);padding:20px 18px;text-align:center;}
  .top-logo{height:52px;width:auto;filter:brightness(0) invert(1);}
  .top-sub{color:rgba(255,255,255,.85);font-size:11px;font-weight:700;letter-spacing:2px;margin-top:8px;}
  .lr-body{padding:18px;background:var(--white);}
  .lr-intro{font-size:12.5px;color:var(--muted);line-height:1.5;margin-bottom:16px;padding:12px;background:var(--cream);border-radius:10px;}
  .lr-section-title{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--navy);margin:18px 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px;}
  .lr-field{margin-bottom:13px;}
  .lr-field label{display:block;font-size:13px;font-weight:700;color:var(--navy);margin-bottom:6px;}
  .lr-field input, .lr-field select, .lr-field textarea{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:12px;font-family:inherit;font-size:15px;color:var(--ink);background:var(--white);box-sizing:border-box;}
  .lr-field textarea{resize:vertical;}
  .lr-row2{display:flex;gap:8px;}
  .lr-row2 .lr-field{flex:1;}
  .lr-tipo-row{display:flex;gap:8px;margin-bottom:16px;}
  .lr-tipo-btn{flex:1;padding:13px;border-radius:10px;border:1.5px solid var(--line);background:var(--white);font-weight:700;font-size:14px;cursor:pointer;color:var(--ink);}
  .lr-tipo-btn.activo{background:var(--navy);color:var(--white);border-color:var(--navy);}
  .lr-submit{width:100%;background:var(--azul);color:var(--white);border:none;border-radius:11px;padding:14px;font-weight:800;font-size:15px;cursor:pointer;margin-top:6px;}
  .lr-confirm{text-align:center;padding:20px 6px;}
  .lr-confirm h2{font-family:'Playfair Display',serif;color:var(--navy);font-size:21px;margin-bottom:8px;}
  .lr-codigo{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:var(--gold);background:var(--cream);border-radius:10px;padding:14px;margin:14px 0;}
  .lr-confirm p{font-size:14px;color:var(--ink);line-height:1.6;text-align:left;}
  .lr-print-btn{background:var(--cream);color:var(--navy);border:1.5px solid var(--line);border-radius:10px;padding:12px;font-weight:700;font-size:13.5px;cursor:pointer;width:100%;margin-top:14px;}
  @media print{
    .top-header, .lr-print-btn, .no-print{display:none;}
  }
</style>
</head>

<script>
(function(){
  const SUPABASE_URL = 'https://tqistvisnbcmiocmimos.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_NyCjJkq-17DqOv-5GVg42Q_Cvt2Bp19';
  const sbHeaders = { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY };
  const contentRoot = document.getElementById('content-root');
  let tipoSeleccionado = 'reclamo';

  function escapeHtml(s){
    return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  async function obtenerIP(){
    try{ const res = await fetch('https://api.ipify.org?format=json'); const data = await res.json(); return data.ip || 'no disponible'; }
    catch(e){ return 'no disponible'; }
  }
  async function sbInsert(table, obj){
    const res = await fetch(SUPABASE_URL + '/rest/v1/' + table, {
      method:'POST',
      headers: Object.assign({'Content-Type':'application/json', Prefer:'return=minimal'}, sbHeaders),
      body: JSON.stringify(obj)
    });
    return res.ok;
  }
  function generarCodigo(){
    const fecha = new Date();
    const yyyymmdd = fecha.toISOString().slice(0,10).replace(/-/g,'');
    const rand = Math.random().toString(36).slice(2,7).toUpperCase();
    return 'TI-'+yyyymmdd+'-'+rand;
  }

  function render(){
    contentRoot.innerHTML =
      '<div class="lr-body">'
        + '<div class="lr-intro">Conforme a la ley, tienes derecho a registrar tu reclamo o queja sobre nuestros servicios. Lo puedes hacer aquí, de forma gratuita. Responderemos dentro del plazo legal de 30 días calendario.</div>'

        + '<div class="lr-tipo-row">'
          + '<button type="button" class="lr-tipo-btn activo" id="tipo-reclamo">Reclamo</button>'
          + '<button type="button" class="lr-tipo-btn" id="tipo-queja">Queja</button>'
        + '</div>'

        + '<div class="lr-section-title">Datos del consumidor</div>'
        + '<div class="lr-row2"><div class="lr-field"><label>Nombres</label><input id="lr-nombres" type="text"/></div><div class="lr-field"><label>Apellidos</label><input id="lr-apellidos" type="text"/></div></div>'
        + '<div class="lr-row2"><div class="lr-field"><label>Tipo de documento</label><select id="lr-tipo-doc"><option value="DNI">DNI</option><option value="CE">Carné de extranjería</option><option value="Pasaporte">Pasaporte</option><option value="RUC">RUC</option></select></div><div class="lr-field"><label>Número de documento</label><input id="lr-num-doc" type="text"/></div></div>'
        + '<div class="lr-field"><label>Domicilio</label><input id="lr-domicilio" type="text"/></div>'
        + '<div class="lr-row2"><div class="lr-field"><label>Teléfono</label><input id="lr-telefono" type="tel"/></div><div class="lr-field"><label>Correo electrónico</label><input id="lr-email" type="email"/></div></div>'
        + '<div class="lr-field" style="display:flex;align-items:center;gap:8px;"><input type="checkbox" id="lr-menor" style="width:auto;"/><label style="margin:0;" for="lr-menor">Soy representante de un/a menor de edad</label></div>'
        + '<div class="lr-field" id="lr-representante-wrap" style="display:none;"><label>Nombre del representante</label><input id="lr-representante" type="text"/></div>'

        + '<div class="lr-section-title">Datos del bien contratado</div>'
        + '<div class="lr-field"><label>Descripción del servicio</label><input id="lr-bien" type="text" placeholder="Ej: Asesoría para venta de propiedad, publicación en portal, etc."/></div>'
        + '<div class="lr-field"><label>Monto reclamado (si aplica)</label><input id="lr-monto" type="text" placeholder="Ej: S/ 500 o dejar en blanco"/></div>'

        + '<div class="lr-section-title">Detalle</div>'
        + '<div class="lr-field"><label>Detalle de tu reclamo o queja</label><textarea id="lr-detalle" rows="4"></textarea></div>'
        + '<div class="lr-field"><label>¿Qué pides como solución?</label><textarea id="lr-pedido" rows="3"></textarea></div>'

        + '<button class="lr-submit" id="lr-submit">Enviar reclamo</button>'
      + '</div>';

    document.getElementById('tipo-reclamo').addEventListener('click', function(){ tipoSeleccionado='reclamo'; this.classList.add('activo'); document.getElementById('tipo-queja').classList.remove('activo'); });
    document.getElementById('tipo-queja').addEventListener('click', function(){ tipoSeleccionado='queja'; this.classList.add('activo'); document.getElementById('tipo-reclamo').classList.remove('activo'); });
    document.getElementById('lr-menor').addEventListener('change', function(e){ document.getElementById('lr-representante-wrap').style.display = e.target.checked ? 'block' : 'none'; });

    document.getElementById('lr-submit').addEventListener('click', async function(){
      const btn = this;
      const nombres = document.getElementById('lr-nombres').value.trim();
      const apellidos = document.getElementById('lr-apellidos').value.trim();
      const numDoc = document.getElementById('lr-num-doc').value.trim();
      const email = document.getElementById('lr-email').value.trim();
      const detalle = document.getElementById('lr-detalle').value.trim();
      if(!nombres || !apellidos || !numDoc || !email || !detalle){
        alert('Completa al menos tu nombre, apellido, documento, correo y el detalle del reclamo.');
        return;
      }
      btn.disabled = true; btn.textContent = 'Enviando...';
      const ip = await obtenerIP();
      const codigo = generarCodigo();
      const registro = {
        id: Date.now()+'-'+Math.random().toString(36).slice(2,7),
        codigo: codigo,
        tipo: tipoSeleccionado,
        consumidor_nombres: nombres,
        consumidor_apellidos: apellidos,
        consumidor_tipo_doc: document.getElementById('lr-tipo-doc').value,
        consumidor_num_doc: numDoc,
        consumidor_domicilio: document.getElementById('lr-domicilio').value.trim(),
        consumidor_telefono: document.getElementById('lr-telefono').value.trim(),
        consumidor_email: email,
        es_menor_edad: document.getElementById('lr-menor').checked,
        representante_nombre: document.getElementById('lr-representante') ? document.getElementById('lr-representante').value.trim() : '',
        bien_descripcion: document.getElementById('lr-bien').value.trim(),
        monto_reclamado: document.getElementById('lr-monto').value.trim(),
        detalle: detalle,
        pedido: document.getElementById('lr-pedido').value.trim(),
        ip_registro: ip
      };
      try{
        const ok = await sbInsert('libro_reclamaciones', registro);
        if(ok){ showConfirm(registro); }
        else { btn.disabled=false; btn.textContent='Enviar reclamo'; alert('No se pudo enviar. Intenta de nuevo.'); }
      }catch(err){
        btn.disabled=false; btn.textContent='Enviar reclamo'; alert('No se pudo conectar. Revisa tu internet.');
      }
    });
  }

  function showConfirm(registro){
    const fecha = new Date().toLocaleString('es-PE');
    contentRoot.innerHTML =
      '<div class="lr-body"><div class="lr-confirm">'
        + '<h2>¡'+ (registro.tipo==='reclamo'?'Reclamo':'Queja') +' registrado!</h2>'
        + '<div class="lr-codigo">'+registro.codigo+'</div>'
        + '<p><b>Fecha de registro:</b> '+fecha+'<br/>'
          + '<b>Nombre:</b> '+escapeHtml(registro.consumidor_nombres+' '+registro.consumidor_apellidos)+'<br/>'
          + '<b>Tipo:</b> '+(registro.tipo==='reclamo'?'Reclamo':'Queja')+'<br/>'
          + '<b>Detalle:</b> '+escapeHtml(registro.detalle)+'</p>'
        + '<p>Guarda este código — es tu constancia. Tarapoto Inmuebles (RUC 20610754164) responderá a tu correo <b>'+escapeHtml(registro.consumidor_email)+'</b> dentro de un plazo máximo de 30 días calendario, conforme al Libro de Reclamaciones regulado por el D.S. N° 011-2011-PCM.</p>'
        + '<button class="lr-print-btn no-print" onclick="window.print()">🖨️ Imprimir / guardar esta constancia</button>'
      + '</div></div>';
  }

  render();
})();
</script>
</body>
</html>
